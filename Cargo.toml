[package]
name = "tulipindicators"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Rust-style technical indicator core for incremental migration from Tulip Indicators C."

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "indicator-bench"
path = "rust/src/bin/indicator-bench.rs"

[[test]]
name = "golden_indicators"
path = "rust/tests/golden_indicators.rs"

[[test]]
name = "beta_parity"
path = "rust/tests/beta_parity.rs"
